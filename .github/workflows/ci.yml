name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python sözdizimi
        run: python -m py_compile main.py database.py guardian.py checkin.py session_monitor.py
      - name: JavaScript sözdizimi
        run: |
          node --check web/app.js
          node --check web/autocomplete.js
          node --check web/roadmap_parser.js
      - name: Testler
        run: python -m unittest discover -s tests -v
