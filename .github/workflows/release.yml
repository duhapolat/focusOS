name: Release

# "v1.0.0" gibi bir etiket gönderildiğinde Windows .exe derlenir ve GitHub Release'e eklenir.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: python -m pip install -r requirements-dev.txt
      - name: Testler
        run: python -m unittest discover -s tests
      - name: EXE derle
        run: python -m PyInstaller --clean --noconfirm FocusOS.spec
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FocusOS.exe
          generate_release_notes: true
